name: 锁妖塔 4小时间隔扫描

on:
  schedule:
    # 每4小时跑一次 (UTC 0/4/8/12/16/20时过5分 = 北京 8/12/16/20/0/4:05)
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pandas numpy python-docx

      - name: 运行全量扫描
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          TZ: Asia/Shanghai
        run: |
          python quant_factors/run_daily_picks.py --top 40 --min-r1 1.5 2>&1 | tee output.log

      - name: 上传Word报告
        uses: actions/upload-artifact@v4
        with:
          name: daily_picks_${{ github.run_id }}
          path: quant_factors/daily_picks_*.docx
          retention-days: 7

      - name: 输出综合结果到运行页面
        run: |
          cat output.log >> $GITHUB_STEP_SUMMARY
